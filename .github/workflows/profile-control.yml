name: Profile Control Center

on:
  workflow_dispatch:
    inputs:
      biography_en:
        description: "English biography (blank = no change)"
        required: false
        type: string
      biography_zh:
        description: "Chinese biography (blank = no change)"
        required: false
        type: string
      primary_affiliation:
        description: "Primary affiliation (blank = no change)"
        required: false
        type: string
      research_areas:
        description: "Research areas, comma- or newline-separated (blank = no change)"
        required: false
        type: string
      description:
        description: "Person schema description (blank = no change)"
        required: false
        type: string
      disambiguating_description:
        description: "Identity disambiguation description (blank = no change)"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publication-data-updates
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply profile controls, build, and validate
        id: control
        env:
          BIOGRAPHY_EN_INPUT: ${{ inputs.biography_en }}
          BIOGRAPHY_ZH_INPUT: ${{ inputs.biography_zh }}
          PRIMARY_AFFILIATION_INPUT: ${{ inputs.primary_affiliation }}
          RESEARCH_AREAS_INPUT: ${{ inputs.research_areas }}
          DESCRIPTION_INPUT: ${{ inputs.description }}
          DISAMBIGUATING_DESCRIPTION_INPUT: ${{ inputs.disambiguating_description }}
        run: python scripts/profile_control.py

      - name: Commit only real changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/profile_config.json
          git add index.html publications.html publications.json publication_inventory.csv
          git add paper_index.json sitemap.xml robots.txt llms.txt llms-full.txt papers
          if git diff --cached --quiet; then
            echo "No effective change. No commit and no Pages deployment."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Commit:" >> "$GITHUB_STEP_SUMMARY"
            echo "skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Deployment:" >> "$GITHUB_STEP_SUMMARY"
            echo "skipped" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Update academic profile presentation"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Commit:" >> "$GITHUB_STEP_SUMMARY"
            echo "created" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Deployment:" >> "$GITHUB_STEP_SUMMARY"
            echo "requested" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: control
    if: needs.control.outputs.changed == 'true'
    uses: ./.github/workflows/static.yml
    permissions:
      contents: read
      pages: write
      id-token: write
