name: Daily publication discovery (Crossref + ORCID)

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover DOI works by exact ORCID in Crossref
        run: python scripts/sync_crossref.py

      - name: Rebuild publication pages
        run: python scripts/build_publications.py

      - name: Commit changes when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications_master.json publications.json publications.html sitemap.xml sync_status.json index.html
          if git diff --cached --quiet; then
            echo "No publication changes."
          else
            git commit -m "Auto-sync publications from Crossref ORCID metadata"
            git push
          fi
