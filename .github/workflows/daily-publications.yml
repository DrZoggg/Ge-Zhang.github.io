name: Daily publication discovery (Crossref + ORCID)

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publication-data-updates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      previous_sha: ${{ steps.commit.outputs.previous_sha }}
      deployment_sha: ${{ steps.commit.outputs.deployment_sha }}

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover DOI works by exact ORCID in Crossref
        run: python scripts/sync_crossref.py

      - name: Rebuild publication pages
        run: python scripts/build_publications.py

      - name: Validate the complete site
        run: python scripts/validate_site.py

      - name: Commit changes when needed
        id: commit
        run: |
          PREVIOUS_SHA="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications_master.json publications.json publications.html publication_inventory.csv
          git add paper_index.json sitemap.xml llms.txt llms-full.txt index.html papers
          if git diff --cached --quiet; then
            echo "No publication changes; ignoring sync_status timestamp-only update."
            git restore sync_status.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add sync_status.json
            git commit -m "Auto-sync publications from Crossref ORCID metadata"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "previous_sha=$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"
            echo "deployment_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/static.yml
    with:
      previous_sha: ${{ needs.sync.outputs.previous_sha }}
      deployment_sha: ${{ needs.sync.outputs.deployment_sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
