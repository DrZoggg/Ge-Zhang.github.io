name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest website
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build website from source data
        run: python scripts/build_publications.py

      - name: Validate generated website
        run: python scripts/validate_site.py

      - name: Prepare clean website files
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R assets papers _site/
          cp index.html publications.html publications.json publication_inventory.csv paper_index.json robots.txt sitemap.xml llms.txt llms-full.txt 404.html _site/
          INDEXNOW_KEY_FILE="$(python -c 'import json; config=json.load(open("data/indexnow_config.json", encoding="utf-8")); print(config["key"] + ".txt")')"
          cp "$INDEXNOW_KEY_FILE" _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify IndexNow of changed public HTML URLs
        if: github.event_name == 'push'
        env:
          INDEXNOW_PREVIOUS_REF: ${{ github.event.before }}
        run: python scripts/indexnow_submit.py --previous-ref "$INDEXNOW_PREVIOUS_REF"
