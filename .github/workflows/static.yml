name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

  workflow_run:
    workflows:
      - "Daily publication discovery (Crossref + ORCID)"
      - "Reconcile with ORCID public works"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare clean website files
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R assets papers _site/
          cp index.html publications.html publications.json publication_inventory.csv robots.txt sitemap.xml llms.txt 404.html _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
