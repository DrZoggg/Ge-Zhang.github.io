name: Reconcile with ORCID public works

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read public ORCID works
        env:
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
        run: python scripts/sync_orcid.py

      - name: Rebuild publication pages
        run: python scripts/build_publications.py

      - name: Commit changes when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications_master.json publications.json publications.html sitemap.xml index.html
          if git diff --cached --quiet; then
            echo "No ORCID changes."
          else
            git commit -m "Reconcile publication database with ORCID"
            git push
          fi
