name: Reconcile with ORCID public works

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read public ORCID works
        env:
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
        run: python scripts/sync_orcid.py

      - name: Rebuild publication pages
        run: python scripts/build_publications.py

      - name: Commit changes when needed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications_master.json publications.json publications.html publication_inventory.csv sitemap.xml index.html
          if git diff --cached --quiet; then
            echo "No ORCID publication changes; ignoring sync_status timestamp-only update."
            git restore sync_status.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add sync_status.json
            git commit -m "Reconcile publication database with ORCID"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: reconcile
    if: needs.reconcile.outputs.changed == 'true'
    uses: ./.github/workflows/static.yml
    permissions:
      contents: read
      pages: write
      id-token: write
